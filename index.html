<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="One short Norwegian sentence every day, with an English translation.">
    <title>Norwegian from Scratch!</title>
    <link rel="stylesheet" href="styles.css">
    <script src="sentences.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="card" aria-labelledby="norwegian">
      <section class="content">
        <p class="eyebrow">NORWEGIAN TODAY</p>

        <article class="daily-sentence" aria-live="polite">
          <p id="norwegian" class="norwegian" lang="no"></p>
          <p id="english" class="english" lang="en"></p>
        </article>

        <p class="note">A short Norwegian sentence, every day.</p>
        <p class="source"><a href="https://www.nb.no/sprakbanken/en/resource-catalogue/oai-nb-no-sbr-68/" target="_blank" rel="noopener noreferrer">Sentences: Norwegian Language Bank · CC BY 4.0</a></p>
      </section>
    </main>
  </body>
</html>
